
[project]
name = "koobtil-backend"
version = "0.1.0"
description = "Backend do projeto Koobtil"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
]

[dependency-groups]
dev = [
    "taskipy>=1.14.1",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/koobtil"]

# Pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = ["-ra", "--strict-markers", "--strict-config"]

# Ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# Mypy
[tool.mypy]
python_version = "3.12"
mypy_path = "src"
strict = true
warn_unused_configs = true
show_error_codes = true

# Tasks
[tool.taskipy.tasks]
dev = "fastapi dev src/koobtil/main.py"
start = "fastapi run src/koobtil/main.py"
test = "pytest"
test-cov = "pytest --cov=koobtil --cov-report=term-missing"
lint = "ruff check ."
format = "ruff format ."
format-check = "ruff format --check ."
typecheck = "mypy src"
check = "task lint && task format-check && task typecheck && task test"

# Database migrations
db-up = "alembic upgrade head"
db-down = "alembic downgrade -1"
db-history = "alembic history"
db-current = "alembic current"
db-revision = "alembic revision --autogenerate -m"
